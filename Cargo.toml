[package]
name = "native_canvas"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# GUI Framework
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg"] }

# 2D Rendering
tiny-skia = "0.11"
vello = "0.10" # GPU-рендер холста (wgpu); фолбэк на tiny-skia при отсутствии GPU
pollster = "0.4" # Синхронное ожидание wgpu-фьючеров в render loop

# Data Structures & Math
slotmap = { version = "1.0", features = ["serde"] }
im = "15" # Персистентные структуры данных для дешёвого Undo/Redo
glam = "0.29" # Быстрая 2D/3D линейная алгебра и матрицы

# Native File Dialogs (Сохранить / Открыть)
rfd = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Performance & Time
instant = "0.1"

[build-dependencies]
slint-build = "1.9"

# Dev-сборка: оптимизировать, иначе CPU-рендер в дебаге очень медленный.
[profile.dev]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true