[package]
name = "native_canvas"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# GUI Framework
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg"] }

# 2D Rendering
tiny-skia = "0.11"
vello = "0.10" # GPU-рендер холста (wgpu); фолбэк на tiny-skia при отсутствии GPU
pollster = "0.4" # Синхронное ожидание wgpu-фьючеров в render loop
glow = { version = "0.17", default-features = false } # Прямой GL-доступ: персистентная текстура канваса (femtovg использует ту же версию)

# Data Structures & Math
slotmap = { version = "1.0", features = ["serde"] }
glam = { version = "0.29", features = ["serde"] } # Быстрая 2D/3D линейная алгебра и матрицы
kurbo = { version = "0.13", features = ["serde"] } # Кривые Безье и контуры (единая версия с vello)
ab_glyph = "0.2" # Растеризация/контуры глифов для текстовых узлов (уже в дереве через vello)

# Native File Dialogs (Сохранить / Открыть)
rfd = "0.15"

# Стандартные пути ОС (конфиг приложения в %APPDATA%)
dirs = "6"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] } # "rc" — для Arc<[u8]> в NodeKind::Image
serde_json = "1.0"

# Performance & Time
instant = "0.1"

# OS metrics (RAM в профилировщике) — только Windows
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }

[build-dependencies]
slint-build = "1.9"

# Dev-сборка: быстрое выполнение без раздувания target
[profile.dev]
opt-level = 1          # Базовая оптимизация для твоего кода
debug = 1              # Уровень 1 оставляет номера строк при паниках, убирая гигабайты таблиц типов

# Отключение отладочных символов для всех внешних зависимостей (Vello, WGPU, Slint, Naga)
[profile.dev.package."*"]
opt-level = 2          # Сторонние крейты исполняются с высокой скоростью
debug = false          # Полный запрет генерации .pdb/.dwarf для библиотек

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"
strip = true